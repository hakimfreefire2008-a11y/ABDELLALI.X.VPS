name: Setup CONFIGES ABDELLALI PRO

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable

      - name: Create Flutter Project
        run: |
          flutter create .
          flutter pub get

      - name: Commit Android Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add android ios web windows linux macos
          git commit -m "Add Flutter platform files" || echo "No changes"
          git push
